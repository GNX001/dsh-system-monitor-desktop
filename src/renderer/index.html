<!doctype html>
<html lang="zh" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>System monitor bar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The capsule. Everything is text plus three buttons; the whole bar is a
         drag handle except those buttons. -->
    <div id="bar" class="dsm-tile" data-pinned="0">
      <span class="dsm-grip" aria-hidden="true">⣿</span>
      <div class="dsm-items" id="items"></div>
      <span class="dsm-status" id="status" hidden></span>
      <span class="dsm-actions">
        <button id="refresh" class="dsm-btn" type="button">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5V5H11"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="pin" class="dsm-btn" type="button" aria-pressed="false">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <g transform="rotate(38 8 8)">
              <rect x="4.6" y="1.9" width="6.8" height="4.4" rx="1.3" fill="currentColor" />
              <rect x="7.3" y="6.3" width="1.4" height="7.6" rx="0.7" fill="currentColor" />
            </g>
          </svg>
        </button>
        <button id="close" class="dsm-btn" type="button">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4.5 4.5l7 7m0-7-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </span>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
